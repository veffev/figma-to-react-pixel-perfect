<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The spec is the test</title><desc>Figma data becomes a spec, the spec drives the components, a script measures the rendered result against the spec and reports numeric deviations.</desc>
<defs><marker id="a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#9ca3af"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#f97316"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#10b981"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6366f1"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="269" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="40" y="36" font-size="18" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="central">The spec is the test</text>
<rect x="40" y="76" width="140" height="84" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="110.0" y="100" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">Figma data</text>
<text x="110.0" y="123" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">design context,</text>
<text x="110.0" y="139" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">variables, motion</text>
<path d="M180 118.0 L207 118.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a-line)"/>
<rect x="210" y="76" width="140" height="84" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="280.0" y="100" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">spec.json</text>
<text x="280.0" y="123" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">exact values</text>
<text x="280.0" y="139" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">per node</text>
<path d="M350 118.0 L377 118.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a-line)"/>
<rect x="380" y="76" width="140" height="84" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="450.0" y="100" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">Components</text>
<text x="450.0" y="123" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">built only from</text>
<text x="450.0" y="139" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">spec values</text>
<path d="M520 118.0 L547 118.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a-line)"/>
<rect x="550" y="76" width="140" height="84" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="620.0" y="100" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">Real browser</text>
<text x="620.0" y="123" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">preview route</text>
<text x="620.0" y="139" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">via Playwright</text>
<path d="M690 118.0 L717 118.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a-line)"/>
<rect x="720" y="76" width="140" height="84" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
<text x="790.0" y="100" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">report.json</text>
<text x="790.0" y="123" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">deviations</text>
<text x="790.0" y="139" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">as numbers</text>
<path d="M790.0 160 L790.0 204 L450.0 204 L450.0 164" fill="none" stroke="#f97316" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-coral)"/>
<text x="620.0" y="222" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">fix from the numbers, max 3 rounds</text>
<path d="M280.0 76 L280.0 54 L620.0 54 L620.0 72" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#a-accent)"/>
<text x="450.0" y="42" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">the same spec is what the script checks</text>
</svg>
